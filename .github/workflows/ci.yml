name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app
      - run: pytest -q
      - name: Revisar la seguridad del propio codigo
        run: bandit -r app -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Vigilar el tamano del paquete
        run: |
          size=$(du -sk dist | cut -f1)
          echo "dist: ${size} kB"
          if [ "$size" -gt 2048 ]; then
            echo "El paquete supera el limite de 2 MB."
            exit 1
          fi
